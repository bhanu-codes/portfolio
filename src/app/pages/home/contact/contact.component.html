<div class="contact-content">
  <p class="eyebrow">Let's connect</p>
  <div class="contact-layout">
    <div class="contact-copy">
      <h2 id="contact-title">Have a problem<br class="desktop-break" /> worth solving?</h2>
      <p class="contact-description">
        I'm always interested in connecting with engineers, recruiters and technology teams working on scalable
        systems, cloud platforms and AI-powered applications.
      </p>
    </div>
    <a class="contact-cta" [href]="emailHref" aria-label="Let's talk by email">
      Let's talk <span aria-hidden="true">&#8599;</span>
    </a>
  </div>

  <div class="contact-bottom">
    <p class="contact-prompt">Good conversations start with a hello.</p>
    <app-social-links />
  </div>
</div>
